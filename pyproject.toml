[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogotoconnect"
version = "0.4.0"
description = "Async Python client for GoTo Connect: SMS via Messaging v2, outbound TTS voice calls via SIP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "audioop-lts>=0.2; python_version >= '3.13'",
]

[project.optional-dependencies]
sms = ["cryptography>=41"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-aiohttp",
    "pytest-playwright",
    "ruff",
    "mypy",
    "httpx",
    "uvicorn",
    "fastapi",
    "cryptography>=41",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiogotoconnect = ["py.typed", "sms/setup/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["src/aiogotoconnect/sms"]
